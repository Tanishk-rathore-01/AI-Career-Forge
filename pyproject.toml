[tool.poetry]
name = "ai-career-forge"
version = "0.1.0"
description = "AI-powered career preparation platform for interview practice, resume matching, and salary negotiations"
authors = ["AI-Career-Forge <team@aicareerforge.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Tanishk-rathore-01/AI-Career-Forge"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.1.0"
httpx = "^0.25.0"
httpx-oauth = "^0.14.0"
psycopg2-binary = "^2.9.0"
google-generativeai = "^0.3.0"
openai = "^1.3.0"
python-dotenv = "^1.0.0"
email-validator = "^2.1.0"
cryptography = "^41.0.0"
aioredis = "^2.0.1"
redis = "^5.0.0"
slowapi = "^0.1.9"
sentry-sdk = "^1.40.0"
structlog = "^24.1.0"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.5.0"
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
sqlalchemy-stubs = "^0.4.0"
types-python-jose = "^3.3.0"
types-redis = "^4.6.0"
bandit = "^1.7.5"
safety = "^2.3.0"
autopep8 = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line too long (handled by black)
    "C901",   # too complex
    "B008",   # allow FastAPI Depends() defaults in route signatures
]
exclude = [
    ".git",
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "alembic.*",
    "google.generativeai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "--strict-markers --disable-warnings"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "security: Security tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
